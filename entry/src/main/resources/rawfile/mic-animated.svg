<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <!-- 麦克风渐变色 -->
    <linearGradient id="mic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- 录音光晕滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* 核心阴影呼吸效果 */
    .pulse-circle {
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      transform-origin: center;
    }
    /* 录音红灯闪烁 */
    .rec-dot {
      animation: blink 1.2s infinite alternate ease-in-out;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.3;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }
    
    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; filter: drop-shadow(0 0 4px #EF4444); }
    }
  </style>

  <!-- 背景外扩散圆环 -->
  <circle class="pulse-circle" cx="50" cy="50" r="38" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.4" />

  <!-- 麦克风主体 -->
  <g transform="translate(0, 0)">
    <!-- 麦克风胶囊头 -->
    <rect x="42" y="24" width="16" height="28" rx="8" fill="url(#mic-grad)" />
    
    <!-- 麦克风底座支架 -->
    <path d="M 34 44 A 16 16 0 0 0 66 44" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <path d="M 50 60 L 50 72" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <path d="M 38 72 L 62 72" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 正在录音状态小红点 -->
  <circle class="rec-dot" cx="68" cy="24" r="4" fill="#EF4444" />
</svg>
