<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 定义背景渐变色 (模拟原图深灰色) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33363F" />
      <stop offset="100%" stop-color="#23252B" />
    </linearGradient>

    <!-- 定义文字渐变色 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B0B3B8" />
    </linearGradient>
  </defs>

  <style>
    .text {
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 2px;
    }
    .btn-group {
      cursor: pointer;
    }
    .btn-group:hover .btn-circle {
      stroke: #6EF195; /* 悬停时变亮 */
      transform: scale(1.05); /* 悬停时微放大 */
    }
    .btn-group:active .btn-circle {
      transform: scale(0.95); /* 点击时微缩小 */
    }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- 逻辑中心点 (200, 200) -->
  <g transform="translate(200, 200)">

    <!-- 中心圆圈 -->
    <circle class="btn-circle" cx="0" cy="25" r="55" fill="none" stroke="#5CDB78" stroke-width="2.5"
            style="transition: all 0.3s ease;">
      <!-- 圆圈呼吸动画 -->
      <animate attributeName="r" values="55;57;55" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- 下载箭头图标 -->
    <g fill="#5CDB78">
      <!-- 箭杆 -->
      <rect x="-9" y="-10" width="18" height="25" rx="1" />
      <!-- 箭头底部 -->
      <path d="M -20 5 L 0 25 L 20 5 Z" />

      <!-- 箭头上下轻微抖动动画 (模拟等待下载) -->
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 3; 0 0" dur="1.5s" repeatCount="indefinite" />
    </g>

    <!-- 下载进度圆环 (模拟加载效果) -->
    <circle cx="0" cy="25" r="55" fill="none" stroke="#FFFFFF" stroke-width="2.5"
            stroke-linecap="round" stroke-dasharray="345" stroke-dashoffset="345" opacity="0.6">
      <!-- 进度条动画 (从 0 到 100%) -->
      <animate attributeName="stroke-dashoffset" from="345" to="0"
               dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- DOWNLOAD 文本 -->
    <text x="0" y="-45" class="text" fill="url(#textGradient)" text-anchor="middle">DOWNLOAD</text>
  </g>
</svg>